name: Test Toolchains

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-toolchains:
    name: Test ${{ matrix.toolchain }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - msvc
          - clang
          # WAIT FOR GCC16
          # - mingw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache Xmake packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.xmake
            build/.gens
          key: ${{ runner.os }}-xmake-test-${{ matrix.toolchain }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-test-${{ matrix.toolchain }}-

      - name: Configure project
        run: xmake f -p windows -a x86 -m release --toolchain=${{ matrix.toolchain }} --runtimes=MT -y -v

      - name: Build
        run: xmake -v

